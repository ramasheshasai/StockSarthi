<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="55%" stop-color="#3730a3"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="box"><rect width="100" height="100" rx="22"/></clipPath>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>

  <!-- Subtle inner highlight top-left -->
  <ellipse cx="28" cy="22" rx="38" ry="22" fill="white" opacity="0.05"/>

  <g clip-path="url(#box)">
    <!-- Grid lines -->
    <line x1="10" y1="68" x2="90" y2="68" stroke="white" stroke-width="0.8" opacity="0.08"/>
    <line x1="10" y1="52" x2="90" y2="52" stroke="white" stroke-width="0.8" opacity="0.06"/>
    <line x1="10" y1="36" x2="90" y2="36" stroke="white" stroke-width="0.8" opacity="0.05"/>

    <!-- Area fill under chart -->
    <path d="M13,76 L26,63 L38,69 L51,48 L63,55 L75,33 L85,20 L85,84 L13,84 Z"
      fill="url(#area)"/>

    <!-- Main chart line -->
    <polyline points="13,76 26,63 38,69 51,48 63,55 75,33 85,20"
      fill="none" stroke="white" stroke-width="4.5"
      stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Intermediate data points -->
    <circle cx="26" cy="63" r="2.2" fill="white" opacity="0.55"/>
    <circle cx="38" cy="69" r="2.2" fill="white" opacity="0.55"/>
    <circle cx="51" cy="48" r="2.2" fill="white" opacity="0.55"/>
    <circle cx="63" cy="55" r="2.2" fill="white" opacity="0.55"/>
    <circle cx="75" cy="33" r="2.2" fill="white" opacity="0.55"/>

    <!-- Peak — green dot (the destination, where Sarthi guides you) -->
    <circle cx="85" cy="20" r="9" fill="#22c55e" opacity="0.2"/>
    <circle cx="85" cy="20" r="5.5" fill="#22c55e" filter="url(#glow)"/>

    <!-- Baseline -->
    <line x1="10" y1="84" x2="90" y2="84"
      stroke="white" stroke-width="1.2" opacity="0.15" stroke-dasharray="4 3"/>
  </g>
</svg>
